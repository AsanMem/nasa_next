name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  # Scheduled redeploy keeps build-time NASA data fresh on Firebase Hosting because production ISR is not reliable enough in this deployment mode.
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the latest master commit when this workflow is schedule-triggered.
          ref: master
      - run: npm ci
      - name: Check runtime credential preparation
        run: node --test tests/firebase-runtime-env.test.cjs tests/deployment-smoke.test.cjs
      - name: Prepare server-only NASA credentials for Firebase SSR
        run: node scripts/prepare-firebase-env.mjs
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase_deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NASA_ODISEY }}
          channelId: live
          projectId: nasa-odisey
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      - name: Verify deployed pages and runtime NASA access
        run: node scripts/smoke-deployment.mjs https://nasa-odisey.web.app
      - name: Remove temporary Firebase runtime credentials
        if: ${{ always() }}
        run: node scripts/prepare-firebase-env.mjs --cleanup
